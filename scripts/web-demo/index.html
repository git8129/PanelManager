<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="PanelManager 上位机静态界面演示，无需连接设备。">
    <title>PanelManager · 在线演示</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E🖥️%3C/text%3E%3C/svg%3E">
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101114; }
        /* The iframe keeps CSS media queries and fixed-position UI at 1080p. */
        #panel { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
            border: 0; transform: translate(-50%, -50%) scale(var(--demo-scale, 0)); }
    </style>
</head>
<body>
    <iframe id="panel" src="panel/index.html" title="PanelManager 静态演示，1920×1080，无设备连接"></iframe>
    <script>
        function fitPanel() {
            document.documentElement.style.setProperty('--demo-scale',
                Math.min(window.innerWidth / 1920, window.innerHeight / 1080, 1));
        }
        window.addEventListener('resize', fitPanel);
        fitPanel();
    </script>
</body>
</html>
